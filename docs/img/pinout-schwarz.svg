<text x="734" y="608" font-size="13.5" fill="#374151">Signal, das wir ansteuern</text>
<rect x="40" y="624" width="24" height="18" rx="4" fill="#fff0d1" stroke="#b45309" stroke-width="1.5"/>
<text x="74" y="638" font-size="13.5" fill="#374151">Warn- oder Kontrollleuchte</text>
<rect x="370" y="624" width="24" height="18" rx="4" fill="#e2ecfb" stroke="#2563eb" stroke-width="1.5"/>
<text x="404" y="638" font-size="13.5" fill="#374151">sonstiger Eingang oder Diagnose</text>
<rect x="700" y="624" width="24" height="18" rx="4" fill="#eee5fa" stroke="#7c3aed" stroke-width="1.5"/>
<text x="734" y="638" font-size="13.5" fill="#374151">Ausgang des Kombis, nie ansteuern</text>
<rect x="40" y="654" width="24" height="18" rx="4" fill="#f3f4f6" stroke="#cfd4da" stroke-width="1.5"/>
<text x="74" y="668" font-size="13.5" fill="#374151">nicht belegt</text>
<rect x="370" y="654" width="24" height="18" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="3.5"/>
<text x="404" y="668" font-size="13.5" fill="#374151">am Tisch angeschlossen (grüner Rahmen)</text>
<text x="40" y="714" font-size="12.5" fill="#6b7280">Quelle: Forenliste (BMW-Syndikat, 2008), auf den wichtigsten Pins durch weitere Quellen bestätigt, nicht mit dem Schaltplan abgeglichen.</text>
<text x="40" y="734" font-size="12.5" fill="#6b7280">Anordnung wie am Kombi aufgedruckt (Foto der Rückseite). Alles vor dem Anschließen am eigenen Kombi prüfen.</text>
