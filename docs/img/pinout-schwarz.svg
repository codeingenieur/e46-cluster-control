<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="774" viewBox="0 0 1000 774" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Schwarzer Stecker, 12 Pins</title>
<rect width="1000" height="774" fill="#ffffff"/>
<rect x="40" y="34" width="56" height="32" rx="6" fill="#3a3a3a" stroke="#111111" stroke-width="2"/>
<text x="114" y="60" font-size="30" font-weight="700" fill="#111827">Schwarzer Stecker, 12 Pins</text>
<text x="40" y="96" font-size="15" fill="#4b5563">Rückseite des Kombis. Oben links 12, oben rechts 6, unten links 7, unten rechts 1 (so steht es am Stecker).</text>
<text x="40" y="118" font-size="15" fill="#4b5563">Linke Spalte von oben nach unten 12 bis 7, rechte Spalte 6 bis 1. Nur die Pins 1 bis 5 sind belegt.</text>
