[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
build_flags =
    -DCAN_TX_PIN=5
    -DCAN_RX_PIN=4
    -DSPEED_PIN=18
    -DSERIAL_BAUD=921600
    ; Zum Testen ohne Cluster (kein ACK noetig, sonst Bus-Off): auskommentieren
    ; -DE46_TWAI_NO_ACK
