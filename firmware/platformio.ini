[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCAN_TX_PIN=5
    -DCAN_RX_PIN=4
    -DSPEED_PIN=18
    ; Must match DEFAULT_BAUD in host/e46cluster/client.py
    -DSERIAL_BAUD=115200
    ; To test without a cluster (no ACK needed, otherwise the bus goes off): uncomment
    ; -DE46_TWAI_NO_ACK
